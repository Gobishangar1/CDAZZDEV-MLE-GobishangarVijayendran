[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agents"
version = "1.0.0"
description = "CDAZZDEV Task 3: multi-agent financial research system (LangGraph)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["research_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
